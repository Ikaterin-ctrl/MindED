<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindED — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="src/css/base.css" />
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <meta name="theme-color" content="#0B0A0F" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-lg);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: var(--sp-2xl) var(--sp-xl);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-lg);
      text-align: center;
    }
    .login-logo {
      width: 52px;
    }
    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .login-card > p {
      font-size: 0.88rem;
      color: var(--clr-text-muted);
      max-width: 280px;
      line-height: 1.75;
    }
    /* Botão Google — fundo branco para manter as cores do logo legíveis */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 13px var(--sp-lg);
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: var(--r-md);
      color: #3c3c3c;
      font-size: 0.93rem;
      font-weight: 600;
      cursor: pointer;
      transition: box-shadow var(--t-base), border-color var(--t-base);
      font-family: var(--font-body);
    }
    .btn-google:hover {
      box-shadow: 0 2px 16px rgba(0,0,0,0.18);
      border-color: #bdbdbd;
    }
    .btn-google:focus-visible {
      outline: 2px solid var(--clr-violet);
      outline-offset: 3px;
    }
    .btn-google svg { flex-shrink: 0; }
    .login-sep {
      width: 100%;
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      color: var(--clr-text-subtle);
      font-size: 0.875rem;
    }
    .login-sep::before,
    .login-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--clr-border);
    }
    .login-error {
      width: 100%;
      padding: 11px var(--sp-md);
      background: rgba(239,68,68,0.10);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--r-md);
      color: #FCA5A5;
      font-size: 0.875rem;
      text-align: left;
      display: none;
      line-height: 1.5;
    }
    .login-error.visible { display: block; }
    .login-loading {
      width: 17px; height: 17px;
      border: 2px solid rgba(60,60,60,0.15);
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }
    .btn-google.loading .login-loading { display: block; }
    .btn-google.loading .btn-google-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login-note {
      font-size: 0.875rem;
      color: var(--clr-text-subtle);
      line-height: 1.65;
    }
    .login-note a { color: var(--clr-violet); text-decoration: underline; }
    .email-tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--clr-border-md); }
    .email-tabs button {
      min-height: 44px; background: none; border: 0; color: var(--clr-text-muted);
      font: inherit; font-weight: 600; cursor: pointer;
    }
    .email-tabs button[aria-selected="true"] { background: #7C3AED; color: #fff; }
    .email-form { display: flex; flex-direction: column; gap: var(--sp-md); text-align: left; }
    .email-field { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: var(--clr-text); }
    .email-field small { color: var(--clr-text-muted); font-size: 0.8125rem; }
    .email-field input {
      min-height: 44px; padding: 0 var(--sp-sm); width: 100%;
      background: var(--clr-bg); border: 1px solid var(--clr-border-md); color: var(--clr-text); font: inherit;
    }
    .email-field input:focus-visible { outline: 2px solid var(--clr-accent); outline-offset: 1px; }
    .password-wrap { display: flex; }
    .password-wrap input { flex: 1; min-width: 0; }
    .password-toggle {
      min-width: 80px; background: var(--clr-surface-md); border: 1px solid var(--clr-border-md); border-left: 0;
      color: var(--clr-text); font: inherit; font-size: 0.875rem; cursor: pointer;
    }
    .email-submit { width: 100%; justify-content: center; }
    .link-btn {
      align-self: center; min-height: 44px; background: none; border: 0; color: var(--clr-accent);
      font: inherit; font-size: 0.9rem; text-decoration: underline; cursor: pointer;
    }
    .login-info { font-size: 0.9rem; color: var(--clr-text); }
    .login-info:empty { display: none; }
    .login-guest { width: 100%; justify-content: center; }
    .email-tabs, .email-form { width: 100%; }
    /* Link de voltar */
    .login-back {
      position: fixed;
      top: var(--sp-md);
      left: var(--sp-md);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      color: var(--clr-text-subtle);
      padding: 6px 12px;
      border-radius: var(--r-sm);
      transition: color var(--t-base), background var(--t-base);
    }
    .login-back:hover { color: var(--clr-text); background: var(--clr-surface); }
  </style>
</head>
<body>
  <script src="src/js/theme.js"></script>
  <!-- Voltar -->
  <a href="index.html" class="login-back" aria-label="Voltar à página inicial">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    Voltar
  </a>

  <main class="login-wrap">
    <div class="login-card glass">
      <span class="logo-link"><span>Mind<b>ED</b></span></span>
      <h1>Boas-vindas ao MindED</h1>
      <p id="login-lead">Entre para adaptar seus textos e guardar seu progresso.</p>

      <div class="login-error" id="login-error" role="alert"></div>

      <button class="btn-google" id="google-btn" aria-label="Entrar com Google">
        <span class="btn-google-label" style="display:flex;align-items:center;gap:10px">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
          Entrar com Google
        </span>
        <div class="login-loading" role="status" aria-label="Autenticando…"></div>
      </button>

      <div class="login-sep">ou com seu e-mail</div>

      <!-- E-mail and password: sign in, create an account, or reset the password -->
      <div class="email-tabs" role="tablist" aria-label="Entrar ou criar conta">
        <button type="button" role="tab" id="tab-entrar" aria-selected="true" aria-controls="email-form">Entrar</button>
        <button type="button" role="tab" id="tab-criar" aria-selected="false" aria-controls="email-form">Criar conta</button>
      </div>
      <form class="email-form" id="email-form" role="tabpanel" aria-labelledby="tab-entrar" novalidate>
        <label class="email-field" id="field-nome" hidden>
          <span>Como quer ser chamada ou chamado</span>
          <input type="text" id="email-nome" autocomplete="nickname" maxlength="40" />
        </label>
        <label class="email-field">
          <span>E-mail</span>
          <input type="email" id="email-endereco" autocomplete="email" required />
        </label>
        <label class="email-field">
          <span>Senha</span>
          <span class="password-wrap">
            <input type="password" id="email-senha" autocomplete="current-password" minlength="8" required />
            <button type="button" class="password-toggle" id="password-toggle" aria-pressed="false">Mostrar</button>
          </span>
          <small id="senha-ajuda">Pelo menos 8 caracteres.</small>
        </label>
        <button type="submit" class="btn btn-primary email-submit" id="email-submit">Entrar</button>
        <button type="button" class="link-btn" id="forgot-btn">Esqueci minha senha</button>
      </form>
      <p class="login-info" id="login-info" role="status"></p>

      <div class="login-sep">ou sem cadastro</div>
      <a class="btn btn-ghost login-guest" href="workspace.html?demo=1">Experimentar sem criar conta</a>

      <p class="login-note">
        Ao entrar, você confirma ter 18 anos ou mais e aceita os
        <a href="termos.html">Termos de Uso</a> e a
        <a href="privacidade.html">Política de Privacidade</a> do MindED.
      </p>
    </div>
  </main>

  <!-- Firebase SDK (compat — works without bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" integrity="sha384-AQ3POAMqIhwS81FrUH95ekxqBZHeP5tG2JfEL3+7GuTtfRLWnrRh32UxwzM+//A9" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" integrity="sha384-TnlRYaR4JYz/lpaGuaiU61PjNberSA4vjLjtF+oRC/IkohkJqnWxw5EmDSOt1vA1" crossorigin="anonymous"></script>

  <script>
    /* ── Firebase config ─────────────────────────────────────────
       Replace the values below with YOUR project's config object
       from: Firebase Console → Project Settings → Your apps → SDK setup
    ──────────────────────────────────────────────────────────── */
    const firebaseConfig = {
      apiKey:            "AIzaSyAOV3zKA6QtrLtGToO-dsfbONhKyw7S80Q",
      authDomain:        "minded-3d49a.firebaseapp.com",
      projectId:         "minded-3d49a",
      storageBucket:     "minded-3d49a.firebasestorage.app",
      messagingSenderId: "1022129331298",
      appId:             "1:1022129331298:web:a1890d2c08c5333cd3853b",
    };

    // Where to go after signing in. Only pages of this site are accepted.
    const NEXT_PAGES = { 'workspace.html': 'Entre para usar o Workspace. Seus textos, o histórico e as revisões ficam guardados na sua conta.' };
    const next = new URLSearchParams(location.search).get('next');
    const target = NEXT_PAGES[next] ? next : 'workspace.html';
    if (NEXT_PAGES[next]) document.getElementById('login-lead').textContent = NEXT_PAGES[next];

    firebase.initializeApp(firebaseConfig);
    const auth     = firebase.auth();
    // Firebase persists the session in IndexedDB by default (LOCAL persistence).
    // Do NOT override with prompt:'select_account' — that forces re-auth every time.
    const provider = new firebase.auth.GoogleAuthProvider();

    const googleBtn  = document.getElementById('google-btn');
    const errorBox   = document.getElementById('login-error');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }

    // Hide page while auth resolves, redirect immediately if already signed in
    document.body.style.visibility = 'hidden';
    auth.onAuthStateChanged(user => {
      if (user && !user.isAnonymous) {
        window.location.replace(target);
      } else {
        document.body.style.visibility = '';
      }
    });

    auth.getRedirectResult().catch(() => showError('Não foi possível entrar. Tente novamente.'));

    // ── E-mail and password ────────────────────────────────────────────
    const AUTH_MESSAGES = {
      'auth/invalid-email':          'Este e-mail não parece certo. Confira e tente de novo.',
      'auth/missing-password':       'Digite a sua senha.',
      'auth/weak-password':          'Use uma senha com pelo menos 8 caracteres.',
      'auth/email-already-in-use':   'Já existe uma conta com este e-mail. Use a aba Entrar.',
      'auth/invalid-credential':     'E-mail ou senha não conferem.',
      'auth/wrong-password':         'E-mail ou senha não conferem.',
      'auth/user-not-found':         'E-mail ou senha não conferem.',
      'auth/too-many-requests':      'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.',
      'auth/network-request-failed': 'Erro de rede. Verifique sua conexão.',
      'auth/operation-not-allowed':  'Entrar com e-mail ainda não está ativado no MindED. Use o Google por enquanto.',
      'auth/user-disabled':          'Esta conta foi desativada.',
    };
    const form      = document.getElementById('email-form');
    const tabEntrar = document.getElementById('tab-entrar');
    const tabCriar  = document.getElementById('tab-criar');
    const fieldNome = document.getElementById('field-nome');
    const nomeInput = document.getElementById('email-nome');
    const emailInput = document.getElementById('email-endereco');
    const senhaInput = document.getElementById('email-senha');
    const submitBtn = document.getElementById('email-submit');
    const forgotBtn = document.getElementById('forgot-btn');
    const infoBox   = document.getElementById('login-info');
    let creating = false;

    function setMode(create) {
      creating = create;
      tabEntrar.setAttribute('aria-selected', String(!create));
      tabCriar.setAttribute('aria-selected', String(create));
      form.setAttribute('aria-labelledby', create ? 'tab-criar' : 'tab-entrar');
      fieldNome.hidden = !create;
      forgotBtn.hidden = create;
      submitBtn.textContent = create ? 'Criar conta' : 'Entrar';
      senhaInput.autocomplete = create ? 'new-password' : 'current-password';
      errorBox.classList.remove('visible');
      infoBox.textContent = '';
    }
    tabEntrar.addEventListener('click', () => setMode(false));
    tabCriar.addEventListener('click', () => setMode(true));

    document.getElementById('password-toggle').addEventListener('click', e => {
      const show = senhaInput.type === 'password';
      senhaInput.type = show ? 'text' : 'password';
      e.currentTarget.textContent = show ? 'Esconder' : 'Mostrar';
      e.currentTarget.setAttribute('aria-pressed', String(show));
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      infoBox.textContent = '';
      const email = emailInput.value.trim();
      const senha = senhaInput.value;
      if (!email) { showError('Digite o seu e-mail.'); emailInput.focus(); return; }
      if (senha.length < 8) { showError('A senha precisa ter pelo menos 8 caracteres.'); senhaInput.focus(); return; }
      submitBtn.disabled = true;
      try {
        if (creating) {
          const { user } = await auth.createUserWithEmailAndPassword(email, senha);
          const nome = nomeInput.value.trim();
          if (nome) await user.updateProfile({ displayName: nome });
          await user.sendEmailVerification().catch(() => {});
        } else {
          await auth.signInWithEmailAndPassword(email, senha);
        }
        // onAuthStateChanged above will redirect
      } catch (err) {
        showError(AUTH_MESSAGES[err.code] || 'Não foi possível entrar agora. Tente de novo.');
        submitBtn.disabled = false;
      }
    });

    forgotBtn.addEventListener('click', async () => {
      errorBox.classList.remove('visible');
      const email = emailInput.value.trim();
      if (!email) { showError('Digite o seu e-mail no campo acima e clique de novo.'); emailInput.focus(); return; }
      try {
        await auth.sendPasswordResetEmail(email);
      } catch (err) {
        if (err.code !== 'auth/user-not-found') { showError(AUTH_MESSAGES[err.code] || 'Não foi possível enviar agora. Tente de novo.'); return; }
      }
      // Same answer either way, so the page does not reveal who has an account
      infoBox.textContent = `Se houver uma conta com ${email}, enviamos um link para criar uma nova senha.`;
    });

    googleBtn.addEventListener('click', async () => {
      errorBox.classList.remove('visible');
      googleBtn.classList.add('loading');
      googleBtn.disabled = true;

      try {
        await auth.signInWithPopup(provider);
        // onAuthStateChanged above will redirect
      } catch (err) {
        googleBtn.classList.remove('loading');
        googleBtn.disabled = false;
        const messages = {
          'auth/popup-closed-by-user':      'Popup fechado antes de concluir o login.',
          'auth/popup-blocked':             'Popup bloqueado pelo navegador. Permita popups para este site.',
          'auth/cancelled-popup-request':   'Requisição cancelada.',
          'auth/network-request-failed':    'Erro de rede. Verifique sua conexão.',
          'auth/internal-error':            'Erro interno. Tente novamente.',
        };
        showError(messages[err.code] || `Erro: ${err.message}`);
      }
    });
  </script>
</body>
</html>
