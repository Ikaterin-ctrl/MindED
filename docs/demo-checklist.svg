<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg1" cx="20%" cy="10%" r="60%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/><stop offset="100%" stop-color="#090D16" stop-opacity="0"/></radialGradient>
    <radialGradient id="bg2" cx="85%" cy="85%" r="50%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.08"/><stop offset="100%" stop-color="#090D16" stop-opacity="0"/></radialGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#090D16"/>
  <rect width="1280" height="800" fill="url(#bg1)"/>
  <rect width="1280" height="800" fill="url(#bg2)"/>

  <!-- Header bar -->
  <rect width="1280" height="64" fill="rgba(9,13,22,0.85)"/>
  <rect width="1280" height="1" y="64" fill="rgba(255,255,255,0.10)"/>
  <circle cx="36" cy="32" r="14" fill="url(#btnGrad)" opacity="0.9" filter="url(#glow)"/>
  <text x="58" y="38" font-size="16" font-weight="700" fill="#F3F4F6" letter-spacing="-0.3">MindED</text>
  <text x="780" y="38" font-size="13" fill="#6B7280">Início</text>
  <text x="848" y="38" font-size="13" fill="#F3F4F6" font-weight="600">Workspace</text>
  <rect x="838" y="42" width="76" height="2" rx="1" fill="url(#btnGrad)" opacity="0.7"/>
  <text x="944" y="38" font-size="13" fill="#6B7280">Preferências</text>

  <!-- ══ LEFT PANEL ══════════════════════════════════════════ -->
  <rect x="32" y="96" width="580" height="672" rx="20" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="64" y="133" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="1.5">ENTRADA DE CONTEÚDO</text>
  <line x1="64" y1="140" x2="580" y2="140" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Textarea -->
  <text x="64" y="166" font-size="12" fill="#9CA3AF" font-weight="500">Cole aqui o texto que deseja adaptar</text>
  <rect x="64" y="176" width="516" height="158" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="80" y="200" font-size="12" fill="#6B7280" font-style="italic">A dislexia é uma dificuldade específica de aprendizagem</text>
  <text x="80" y="218" font-size="12" fill="#6B7280" font-style="italic">de base neurobiológica. Afeta a fluência e a precisão</text>
  <text x="80" y="236" font-size="12" fill="#6B7280" font-style="italic">no reconhecimento de palavras e a capacidade de</text>
  <text x="80" y="254" font-size="12" fill="#6B7280" font-style="italic">soletração e decodificação. Resulta de um déficit no</text>
  <text x="80" y="272" font-size="12" fill="#6B7280" font-style="italic">componente fonológico da linguagem...</text>
  <text x="550" y="325" font-size="10" fill="#6B7280" text-anchor="end">387 / 8000</text>

  <!-- Mode selector -->
  <text x="64" y="360" font-size="12" fill="#9CA3AF" font-weight="500">Modo Cognitivo</text>
  <!-- Metáfora — unselected -->
  <rect x="64" y="372" width="158" height="80" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="143" y="402" font-size="22" text-anchor="middle">🧠</text>
  <text x="143" y="421" font-size="11" font-weight="600" fill="#9CA3AF" text-anchor="middle">Metáfora</text>
  <text x="143" y="437" font-size="9" fill="#6B7280" text-anchor="middle">Analogias do cotidiano</text>
  <!-- Microtarefas — SELECTED -->
  <rect x="234" y="372" width="158" height="80" rx="12" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.55)" stroke-width="1.5"/>
  <text x="313" y="402" font-size="22" text-anchor="middle">✅</text>
  <text x="313" y="421" font-size="11" font-weight="600" fill="#F3F4F6" text-anchor="middle">Microtarefas</text>
  <text x="313" y="437" font-size="9" fill="#9CA3AF" text-anchor="middle">Checklist gamificado</text>
  <!-- Resumo — unselected -->
  <rect x="404" y="372" width="158" height="80" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="483" y="402" font-size="22" text-anchor="middle">📋</text>
  <text x="483" y="421" font-size="11" font-weight="600" fill="#9CA3AF" text-anchor="middle">Resumo</text>
  <text x="483" y="437" font-size="9" fill="#6B7280" text-anchor="middle">Tópicos essenciais</text>

  <!-- Profile -->
  <text x="64" y="482" font-size="12" fill="#9CA3AF" font-weight="500">Perfil / Contexto</text>
  <rect x="64" y="492" width="516" height="40" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="82" y="517" font-size="12" fill="#F3F4F6">Dislexia — Texto curto e direto</text>
  <polygon points="558,508 566,508 562,516" fill="#6B7280"/>

  <!-- CTA Button -->
  <rect x="64" y="554" width="516" height="52" rx="999" fill="url(#btnGrad)" filter="url(#glow)"/>
  <text x="322" y="585" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">▶  Adaptar com MindED</text>

  <!-- ══ RIGHT PANEL ══════════════════════════════════════════ -->
  <rect x="636" y="96" width="612" height="672" rx="20" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="668" y="133" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="1.5">OUTPUT COGNITIVO</text>
  <line x1="668" y1="140" x2="1216" y2="140" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Output title -->
  <text x="668" y="174" font-size="19" font-weight="700" fill="#F3F4F6">Entendendo a Dislexia:</text>
  <text x="668" y="198" font-size="19" font-weight="700" fill="#F3F4F6">Seu Plano de Estudo em 7 Passos</text>

  <!-- Intro text -->
  <text x="668" y="228" font-size="12" fill="#9CA3AF">Vamos decompor esse tema em ações práticas e sequenciais.</text>
  <text x="668" y="246" font-size="12" fill="#9CA3AF">Marque cada etapa ao concluir — você já está no caminho!</text>

  <!-- Progress bar -->
  <rect x="668" y="262" width="432" height="8" rx="4" fill="rgba(255,255,255,0.07)"/>
  <rect x="668" y="262" width="246" height="8" rx="4" fill="url(#progressGrad)"/>
  <text x="1116" y="272" font-size="11" font-weight="600" fill="#9CA3AF" text-anchor="end">4 / 7</text>

  <!-- Checklist items -->

  <!-- Item 1 — DONE -->
  <rect x="668" y="284" width="548" height="46" rx="10" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <circle cx="692" cy="307" r="10" fill="#34D399"/>
  <!-- checkmark -->
  <polyline points="687,307 691,311 698,303" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="714" y="311" font-size="12" fill="#6B7280" text-decoration="line-through">Definir o que é dislexia com suas próprias palavras</text>

  <!-- Item 2 — DONE -->
  <rect x="668" y="338" width="548" height="46" rx="10" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <circle cx="692" cy="361" r="10" fill="#34D399"/>
  <polyline points="687,361 691,365 698,357" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="714" y="365" font-size="12" fill="#6B7280" text-decoration="line-through">Pesquisar 3 exemplos reais de pessoas com dislexia</text>

  <!-- Item 3 — DONE -->
  <rect x="668" y="392" width="548" height="46" rx="10" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <circle cx="692" cy="415" r="10" fill="#34D399"/>
  <polyline points="687,415 691,419 698,411" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="714" y="419" font-size="12" fill="#6B7280" text-decoration="line-through">Identificar a diferença entre dislexia e déficit visual</text>

  <!-- Item 4 — DONE -->
  <rect x="668" y="446" width="548" height="46" rx="10" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <circle cx="692" cy="469" r="10" fill="#34D399"/>
  <polyline points="687,469 691,473 698,465" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="714" y="473" font-size="12" fill="#6B7280" text-decoration="line-through">Explorar o conceito de processamento fonológico</text>

  <!-- Item 5 — PENDING -->
  <rect x="668" y="500" width="548" height="46" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <circle cx="692" cy="523" r="10" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <text x="714" y="527" font-size="12" fill="#9CA3AF">Estudar 2 estratégias de ensino adaptado para dislexia</text>

  <!-- Item 6 — PENDING -->
  <rect x="668" y="554" width="548" height="46" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <circle cx="692" cy="577" r="10" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <text x="714" y="581" font-size="12" fill="#9CA3AF">Ler 1 artigo científico e anotar os termos-chave</text>

  <!-- Item 7 — PENDING -->
  <rect x="668" y="608" width="548" height="46" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <circle cx="692" cy="631" r="10" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <text x="714" y="635" font-size="12" fill="#9CA3AF">Criar um resumo em tópicos com bullet points</text>

  <!-- Divider + Actions -->
  <line x1="668" y1="670" x2="1216" y2="670" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <rect x="668" y="682" width="98" height="34" rx="999" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="717" y="703" font-size="11" fill="#9CA3AF" text-anchor="middle">📋 Copiar</text>
  <rect x="778" y="682" width="128" height="34" rx="999" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="842" y="703" font-size="11" fill="#9CA3AF" text-anchor="middle">⬇ Exportar MD</text>

  <!-- Watermark -->
  <text x="640" y="790" font-size="10" fill="rgba(255,255,255,0.15)" text-anchor="middle">MindED — Workspace · Modo Microtarefas (4/7 concluídas)</text>
</svg>
