<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindED — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="src/css/base.css" />
  <link rel="icon" type="image/png" href="img/logominded.png" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-lg);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: var(--sp-2xl) var(--sp-xl);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-lg);
      text-align: center;
    }
    .login-logo {
      width: 52px;
    }
    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .login-card > p {
      font-size: 0.88rem;
      color: var(--clr-text-muted);
      max-width: 280px;
      line-height: 1.75;
    }
    /* Botão Google — fundo branco para manter as cores do logo legíveis */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 13px var(--sp-lg);
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: var(--r-md);
      color: #3c3c3c;
      font-size: 0.93rem;
      font-weight: 600;
      cursor: pointer;
      transition: box-shadow var(--t-base), border-color var(--t-base);
      font-family: var(--font-body);
    }
    .btn-google:hover {
      box-shadow: 0 2px 16px rgba(0,0,0,0.18);
      border-color: #bdbdbd;
    }
    .btn-google:focus-visible {
      outline: 2px solid var(--clr-violet);
      outline-offset: 3px;
    }
    .btn-google svg { flex-shrink: 0; }
    .login-sep {
      width: 100%;
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      color: var(--clr-text-subtle);
      font-size: 0.75rem;
    }
    .login-sep::before,
    .login-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--clr-border);
    }
    .login-error {
      width: 100%;
      padding: 11px var(--sp-md);
      background: rgba(239,68,68,0.10);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--r-md);
      color: #FCA5A5;
      font-size: 0.84rem;
      text-align: left;
      display: none;
      line-height: 1.5;
    }
    .login-error.visible { display: block; }
    .login-loading {
      width: 17px; height: 17px;
      border: 2px solid rgba(60,60,60,0.15);
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }
    .btn-google.loading .login-loading { display: block; }
    .btn-google.loading .btn-google-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login-note {
      font-size: 0.73rem;
      color: var(--clr-text-subtle);
      line-height: 1.65;
    }
    .login-note a { color: var(--clr-violet); text-decoration: underline; }
    /* Link de voltar */
    .login-back {
      position: fixed;
      top: var(--sp-md);
      left: var(--sp-md);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.83rem;
      color: var(--clr-text-subtle);
      padding: 6px 12px;
      border-radius: var(--r-sm);
      transition: color var(--t-base), background var(--t-base);
    }
    .login-back:hover { color: var(--clr-text); background: var(--clr-surface); }
  </style>
</head>
<body>
  <!-- Voltar -->
  <a href="index.html" class="login-back" aria-label="Voltar à página inicial">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    Voltar
  </a>

  <div class="login-wrap">
    <div class="login-card glass">
      <img src="img/logominded.png" alt="MindED" class="login-logo" />
      <h1>Bem-vindo ao MindED</h1>
      <p>Entre com a sua conta Google para guardar o histórico e as suas preferências.</p>

      <div class="login-error" id="login-error" role="alert"></div>

      <button class="btn-google" id="google-btn" aria-label="Entrar com Google">
        <span class="btn-google-label" style="display:flex;align-items:center;gap:10px">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
          Entrar com Google
        </span>
        <div class="login-loading" role="status" aria-label="A autenticar…"></div>
      </button>

      <div class="login-sep">início de sessão seguro</div>

      <p class="login-note">
        Ao entrar, aceita os <a href="#">Termos de Uso</a> e a
        <a href="#">Política de Privacidade</a> do MindED.
      </p>
    </div>
  </div>

  <!-- Firebase SDK (compat — works without bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    /* ── Firebase config ─────────────────────────────────────────
       Replace the values below with YOUR project's config object
       from: Firebase Console → Project Settings → Your apps → SDK setup
    ──────────────────────────────────────────────────────────── */
    const firebaseConfig = {
      apiKey:            "AIzaSyAOV3zKA6QtrLtGToO-dsfbONhKyw7S80Q",
      authDomain:        "minded-3d49a.firebaseapp.com",
      projectId:         "minded-3d49a",
      storageBucket:     "minded-3d49a.firebasestorage.app",
      messagingSenderId: "1022129331298",
      appId:             "1:1022129331298:web:a1890d2c08c5333cd3853b",
    };

    firebase.initializeApp(firebaseConfig);
    const auth     = firebase.auth();
    // Firebase persists the session in IndexedDB by default (LOCAL persistence).
    // Do NOT override with prompt:'select_account' — that forces re-auth every time.
    const provider = new firebase.auth.GoogleAuthProvider();

    const googleBtn  = document.getElementById('google-btn');
    const errorBox   = document.getElementById('login-error');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }

    // Hide page while auth resolves, redirect immediately if already signed in
    document.body.style.visibility = 'hidden';
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.replace('workspace.html');
      } else {
        document.body.style.visibility = '';
      }
    });

    googleBtn.addEventListener('click', async () => {
      errorBox.classList.remove('visible');
      googleBtn.classList.add('loading');
      googleBtn.disabled = true;

      try {
        await auth.signInWithPopup(provider);
        // onAuthStateChanged above will redirect
      } catch (err) {
        googleBtn.classList.remove('loading');
        googleBtn.disabled = false;
        const messages = {
          'auth/popup-closed-by-user':      'Popup fechado antes de concluir o login.',
          'auth/popup-blocked':             'Popup bloqueado pelo navegador. Permita popups para este site.',
          'auth/cancelled-popup-request':   'Requisição cancelada.',
          'auth/network-request-failed':    'Erro de rede. Verifique sua conexão.',
          'auth/internal-error':            'Erro interno. Tente novamente.',
        };
        showError(messages[err.code] || `Erro: ${err.message}`);
      }
    });
  </script>
</body>
</html>
